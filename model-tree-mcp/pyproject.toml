[project]
name = "model-tree-mcp"
version = "0.1.0"
description = "MCP server que recomenda modelos preditivos da árvore model-tree."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.2.0",
  "httpx>=0.27",
]

[project.scripts]
model-tree-mcp = "model_tree_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_tree_mcp"]
