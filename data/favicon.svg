<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="neon" x1="0" y1="64" x2="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22e0c8"/>
      <stop offset="0.55" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#ff3bd0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="14" fill="#0d0d14"/>

  <g filter="url(#glow)" fill="none" stroke="url(#neon)" stroke-width="2.2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 50 L20 32"/>
    <path d="M32 50 L44 32"/>
    <path d="M20 32 L12 16"/>
    <path d="M20 32 L24 16"/>
    <path d="M44 32 L40 16"/>
    <path d="M44 32 L52 16"/>
  </g>

  <g filter="url(#glow)" fill="#eafffb">
    <circle cx="32" cy="50" r="3.6"/>
    <circle cx="20" cy="32" r="2.8"/>
    <circle cx="44" cy="32" r="2.8"/>
    <circle cx="12" cy="16" r="2.2"/>
    <circle cx="24" cy="16" r="2.2"/>
    <circle cx="40" cy="16" r="2.2"/>
    <circle cx="52" cy="16" r="2.2"/>
  </g>
</svg>
